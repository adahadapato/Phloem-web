name: Website CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# One deployment at a time; a newer push waits for the running one to finish
concurrency:
  group: phloem-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build and Deploy Phloem Website
    runs-on: windows-latest

    steps:
      # ============================================================
      # SOURCE
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE SETUP
      #
      # Vite needs a current Node (22 LTS). npm's download cache is
      # kept between runs, keyed on package-lock.json.
      # ============================================================

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Display Node information
        run: |
          node --version
          npm --version


      # ============================================================
      # INSTALL, CHECK AND BUILD
      #
      # npm ci installs exactly what package-lock.json says (and
      # fails if package.json and the lock file disagree).
      #
      # The API's address comes from .env.production
      # (VITE_API_BASE_URL). To build against another API without
      # changing the repo, set the repository VARIABLE
      # API_BASE_URL (Settings → Secrets and variables → Actions →
      # Variables); it is used instead when it's set.
      #
      # Nothing secret ever goes into the website: everything in it
      # is downloaded by every visitor's browser.
      # ============================================================

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build website
        shell: powershell
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:API_BASE_URL)) {
              # Vite reads real environment variables before the .env files
              $env:VITE_API_BASE_URL = $env:API_BASE_URL.TrimEnd('/')
              Write-Host "Building against API_BASE_URL: $env:VITE_API_BASE_URL"
          }
          else {
              Write-Host "Building against the API in .env.production"
          }

          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed with exit code $LASTEXITCODE" }

          # The site can't work without these two files
          if (-not (Test-Path ".\dist\index.html")) { throw "dist\index.html was not produced." }
          if (-not (Test-Path ".\dist\web.config")) { throw "dist\web.config is missing (it comes from public\web.config)." }


      # ============================================================
      # BUILD ARTIFACT
      #
      # The built site, downloadable from the run's page (useful to
      # see exactly what was deployed). Contains no secrets.
      # ============================================================

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: phloem-website
          path: ./dist
          if-no-files-found: error


      # ============================================================
      # DEPLOY TO SMARTERASP.NET
      #
      # Copies dist\ to the website's folder with Web Deploy, the
      # same way as the API.
      #
      # Required GitHub repository SECRETS (in THIS repo; the API
      # repo's secrets aren't visible here):
      #
      # WEBSITE_NAME            The WEBSITE's site name on SmarterASP
      #                         (the one for phloemmarket.com), NOT the
      #                         API's site.
      # SERVER_COMPUTER_NAME    Web Deploy service URL (same as the API's
      #                         if both sites are on the same account)
      # SERVER_USERNAME         Web Deploy user name
      # SERVER_PASSWORD         Web Deploy password
      #
      # DoNotDeleteRule: files on the server that aren't in this build
      # are left alone. Old build files (dist\assets\*-hash.js) simply
      # stay unused, and a wrong WEBSITE_NAME can never wipe another
      # site. To clean old builds out, delete the assets folder on the
      # server now and then; the next deploy puts the current one back.
      #
      # Skipped for pull requests (they are only built and checked).
      # ============================================================

      - name: Deploy website to SmarterASP.NET
        if: github.event_name != 'pull_request'
        shell: powershell
        env:
          SMARTERASP_SITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SMARTERASP_SERVICE_URL: ${{ secrets.SERVER_COMPUTER_NAME }}
          SMARTERASP_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SMARTERASP_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          foreach ($name in 'SMARTERASP_SITE_NAME', 'SMARTERASP_SERVICE_URL', 'SMARTERASP_USERNAME', 'SMARTERASP_PASSWORD') {
              if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
                  throw "$name is empty: add the matching secret to this repository (see the comment above this step)."
              }
          }

          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"

          if (-not (Test-Path $msdeploy)) {
              throw "MSDeploy was not found at: $msdeploy"
          }

          $sourcePath = (Resolve-Path ".\dist").Path

          Write-Host "Deploying Phloem website..."
          Write-Host "Site: $env:SMARTERASP_SITE_NAME"
          Write-Host "Source: $sourcePath"

          & $msdeploy `
            -verb:sync `
            -source:contentPath="$sourcePath" `
            -dest:contentPath="$env:SMARTERASP_SITE_NAME",computerName="$env:SMARTERASP_SERVICE_URL",userName="$env:SMARTERASP_USERNAME",password="$env:SMARTERASP_PASSWORD",authtype="Basic",includeAcls="False" `
            -allowUntrusted `
            -disableLink:AppPoolExtension `
            -disableLink:ContentExtension `
            -disableLink:CertificateExtension `
            -enableRule:DoNotDeleteRule `
            -verbose

          if ($LASTEXITCODE -ne 0) {
              throw "MSDeploy failed with exit code $LASTEXITCODE"
          }

          Write-Host "Phloem website deployment completed successfully."


      # ============================================================
      # CHECK THE SITE IS UP
      #
      # Runs only when the WEBSITE_BASE_URL repository VARIABLE is
      # set, e.g. https://phloemmarket.com
      #
      # Checks the home page AND a deep link (/explore): the deep link
      # only works when web.config's single-page-app rule is active on
      # the server (IIS URL Rewrite), which is exactly what breaks
      # refreshing a page or opening an emailed link.
      # ============================================================

      - name: Check the website is up
        if: github.event_name != 'pull_request' && vars.WEBSITE_BASE_URL != ''
        shell: powershell
        env:
          WEBSITE_BASE_URL: ${{ vars.WEBSITE_BASE_URL }}
        run: |
          $base = $env:WEBSITE_BASE_URL.TrimEnd('/')

          foreach ($path in '/', '/explore') {
              $url = "$base$path"
              $ok = $false
              for ($i = 1; $i -le 6; $i++) {
                  try {
                      $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
                      if ($response.StatusCode -eq 200 -and $response.Content -match 'id="root"') {
                          Write-Host "OK: $url"
                          $ok = $true
                          break
                      }
                  }
                  catch {
                      Write-Host "Attempt ${i} for ${url}: not ready yet ($($_.Exception.Message))"
                  }
                  Start-Sleep -Seconds 10
              }
              if (-not $ok) {
                  throw "$url didn't answer with the website. If only /explore fails, the server is ignoring web.config's rewrite rule."
              }
          }

          Write-Host "Phloem website is live at $base"
